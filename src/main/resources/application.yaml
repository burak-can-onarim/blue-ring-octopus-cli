octopus:
  version: "@project.version@"
  model:
    num-ctx: 8192        # context window in tokens; Ollama's own default is smaller and cuts long prompts silently
    max-tokens: 4096     # upper limit for one answer, so a model that loops cannot run forever
    think: off           # off | auto | low | medium | high; off lets thinking models (gemma4, qwen3, ...) answer directly
  analysis:
    part-tokens: 0       # 0: a file that fits the window is reviewed in one piece; above 0: a file bigger than this many tokens is reviewed in parts of at most that size

spring:
  application:
    name: blue-ring-octopus-cli
  shell:
    interactive:
      enabled: false
  main:
    banner-mode: off # Spring Boot yazısını kaldırır

logging:
  file:
    name: logs/octopus.log
  threshold:
    console: "OFF"
  level:
    root: WARN
    org.jline: ERROR

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434                # Localde JDK25 varsa ve EXE dosyası ile aynı klasördeyse
      # base-url: http://host.docker.internal:11434   # Docker ile ayağa kaldırıldıysa
      model-name: ${AI_MODEL_NAME:qwen2.5-coder}
      temperature: 0.2
      timeout: 5m