<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">Blue Ring Octopus CLI</title>
  <desc id="d">Local-first AI code analysis and generation in your terminal, powered by Ollama, LangChain4j, Spring Boot and Lanterna.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="arms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="338" rx="23" fill="none" stroke="#313244" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(70 50) scale(0.94)">
    <g fill="none" stroke="url(#arms)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 142 C74 166 50 166 42 192 C38 207 54 216 62 206"/>
      <path d="M106 148 C98 176 84 190 86 216 C87 228 100 230 104 220"/>
      <path d="M128 150 C120 176 138 196 128 222"/>
      <path d="M150 148 C158 176 172 190 170 216 C169 228 156 230 152 220"/>
      <path d="M166 142 C182 166 206 166 214 192 C218 207 202 216 194 206"/>
    </g>
    <path d="M62 122 C62 60 92 30 128 30 C164 30 194 60 194 122 C194 138 182 148 166 148 L90 148 C74 148 62 138 62 122 Z" fill="url(#body)"/>
    <g fill="#1e1e2e" stroke="#94e2d5" stroke-width="4">
      <circle cx="104" cy="62" r="12"/>
      <circle cx="152" cy="62" r="12"/>
      <circle cx="128" cy="92" r="12"/>
    </g>
    <g fill="#94e2d5">
      <circle cx="104" cy="62" r="4.4"/>
      <circle cx="152" cy="62" r="4.4"/>
      <circle cx="128" cy="92" r="4.4"/>
    </g>
    <circle cx="100" cy="126" r="12" fill="#1e1e2e"/>
    <circle cx="156" cy="126" r="12" fill="#1e1e2e"/>
    <circle cx="103" cy="123" r="4.2" fill="#cdd6f4"/>
    <circle cx="159" cy="123" r="4.2" fill="#cdd6f4"/>
  </g>

  <!-- wordmark -->
  <text x="340" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700" fill="url(#title)">Blue Ring Octopus CLI</text>
  <text x="342" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#a6adc8">Local-first AI code analysis &amp; generation, right in your terminal.</text>

  <!-- stack chips -->
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="19" text-anchor="middle" fill="#cdd6f4">
    <g transform="translate(342 232)">
      <rect width="106" height="40" rx="20" fill="#313244" stroke="#45475a"/>
      <text x="53" y="26">Ollama</text>
    </g>
    <g transform="translate(464 232)">
      <rect width="164" height="40" rx="20" fill="#313244" stroke="#45475a"/>
      <text x="82" y="26">LangChain4j</text>
    </g>
    <g transform="translate(644 232)">
      <rect width="186" height="40" rx="20" fill="#313244" stroke="#45475a"/>
      <text x="93" y="26">Spring Boot 4</text>
    </g>
    <g transform="translate(846 232)">
      <rect width="176" height="40" rx="20" fill="#313244" stroke="#45475a"/>
      <text x="88" y="26">Lanterna TUI</text>
    </g>
    <g transform="translate(1038 232)">
      <rect width="118" height="40" rx="20" fill="#313244" stroke="#45475a"/>
      <text x="59" y="26">Java 25</text>
    </g>
  </g>
</svg>
