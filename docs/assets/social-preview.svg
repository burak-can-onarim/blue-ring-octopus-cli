<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">Blue Ring Octopus CLI social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="arms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- mark -->
  <image href="octopus.png" x="-12" y="52" width="586" height="562" preserveAspectRatio="xMidYMid meet"/>

  <text x="520" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="url(#title)">Blue Ring</text>
  <text x="520" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="url(#title)">Octopus CLI</text>
  <text x="522" y="414" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" fill="#a6adc8">Local-first AI code analysis &amp; generation</text>
  <text x="522" y="454" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" fill="#a6adc8">in your terminal. No cloud, no API keys.</text>

  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="21" text-anchor="middle" fill="#cdd6f4">
    <g transform="translate(522 500)">
      <rect width="116" height="44" rx="22" fill="#313244" stroke="#45475a"/>
      <text x="58" y="29">Ollama</text>
    </g>
    <g transform="translate(654 500)">
      <rect width="180" height="44" rx="22" fill="#313244" stroke="#45475a"/>
      <text x="90" y="29">LangChain4j</text>
    </g>
    <g transform="translate(850 500)">
      <rect width="204" height="44" rx="22" fill="#313244" stroke="#45475a"/>
      <text x="102" y="29">Spring Boot 4</text>
    </g>
    <g transform="translate(1070 500)">
      <rect width="130" height="44" rx="22" fill="#313244" stroke="#45475a"/>
      <text x="65" y="29">Java 25</text>
    </g>
  </g>

  <text x="96" y="596" font-family="'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="22" fill="#7f849c">github.com/burak-can-onarim/blue-ring-octopus-cli</text>
</svg>
