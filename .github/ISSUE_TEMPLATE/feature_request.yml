name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The clearer the *problem* is, the easier it is to find a good solution.
        The [roadmap](https://github.com/burak-can-onarim/blue-ring-octopus-cli#roadmap) lists what is already planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
      placeholder: "When I review a large module I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you would expect, including any commands, keys or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Code analysis mode
        - Code generation mode
        - Documentation mode (planned)
        - Unit-test mode (planned)
        - Full-screen UI
        - One-shot commands
        - Models / Ollama integration
        - Docker / distribution
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
