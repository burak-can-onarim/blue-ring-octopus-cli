name: Release

# Pushing a tag such as v0.2.0 builds the JAR, publishes a GitHub Release with generated notes and
# a checksum, and pushes the container image to ghcr.io. The tag is the single source of truth for
# the version: it is written into the build, so no pom.xml edit is needed.
#
# Run it manually (Actions -> Release -> Run workflow) for a dry run: everything is built and
# tested, but nothing is published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dryrun"
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building version $version (prerelease: $prerelease)"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Apply the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp target/blue-ring-octopus-cli.jar "dist/blue-ring-octopus-cli-${VERSION}.jar"
          cd dist
          sha256sum "blue-ring-octopus-cli-${VERSION}.jar" > "blue-ring-octopus-cli-${VERSION}.jar.sha256"
          cat "blue-ring-octopus-cli-${VERSION}.jar.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.jar

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          cat > header.md <<EOF
          ## Blue Ring Octopus CLI ${VERSION}

          **Run it** (JDK 25 and a running [Ollama](https://ollama.com) are required):

          \`\`\`bash
          java --enable-native-access=ALL-UNNAMED -jar blue-ring-octopus-cli-${VERSION}.jar
          \`\`\`

          **Or with Docker:** \`docker pull ghcr.io/${GH_REPO}:${VERSION}\`

          Verify the download with the \`.sha256\` file, or with \`gh attestation verify blue-ring-octopus-cli-${VERSION}.jar --repo ${GH_REPO}\`.
          See the [README](https://github.com/${GH_REPO}#readme) and the [CHANGELOG](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md).

          ---

          EOF
          gh release create "$TAG" dist/* \
            --title "Blue Ring Octopus CLI $TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file header.md \
            "${flags[@]}"

  container-image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' && github.ref_type == 'tag' }}
            type=raw,value=dryrun,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
