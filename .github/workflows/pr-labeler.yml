name: PR labeler

# Labels pull requests from their Conventional Commit title ("feat: ...", "fix(ui): ...") so the
# generated release notes are grouped correctly. It never checks out or runs code from the PR.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const match = /^(\w+)(\([^)]*\))?(!)?:/.exec(pr.title);
            if (!match) {
              core.info(`Title "${pr.title}" is not a Conventional Commit; nothing to label.`);
              return;
            }
            const [, type, , bang] = match;
            const byType = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              test: 'tests',
              ci: 'ci',
              build: 'ci',
              deps: 'dependencies',
            };
            const wanted = new Set();
            if (byType[type]) wanted.add(byType[type]);
            if (bang) wanted.add('breaking');
            if (/\bdocker\b/i.test(pr.title)) wanted.add('docker');
            if (wanted.size === 0) return;

            const current = new Set(pr.labels.map(l => l.name));
            const toAdd = [...wanted].filter(l => !current.has(l));
            if (toAdd.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: toAdd,
            });
            core.info(`Added labels: ${toAdd.join(', ')}`);
